site_name: Poscidyn
site_description: Python Oscillator Dynamics
site_url: https://rknetemann.github.io/poscidyn/
repo_url: https://github.com/rknetemann/poscidyn
repo_name: rknetemann/poscidyn

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_signature: true
            signature_crossrefs: true
            docstring_style: google
            merge_init_into_class: true

nav:
  - Overview: index.md
  - Is Poscidyn for me?: for-who-is-poscidyn.md
  - Installation: getting-started/installation.md

  - Quickstart:
    - First frequency sweep: quickstart/frequency-sweep.md
    - First time response: quickstart/time-response.md

  - Concepts:
    - The Poscidyn workflow: concepts/workflow.md
    - Multistart and synthetic sweeps: getting-started/understanding-poscidyn/start-here.md
    - Response measures:
      - Demodulation: getting-started/understanding-poscidyn/response-measures/demodulation.md
      - RMS, minimum, and maximum: concepts/response-measures.md
    - Accuracy, performance, and limitations: getting-started/limitations.md

  - Guides:
    - Define an oscillator: usage/basic-usage/oscillator-models.md
    - Define an excitation: usage/basic-usage/excitation-models.md
    - Run a time response: usage/basic-usage/time-response.md
    - Run a frequency sweep: usage/basic-usage/frequency-sweep.md
    - Configure time integration: getting-started/understanding-poscidyn/solvers/time-integration-solver.md
    - Configure multistart: getting-started/understanding-poscidyn/multistarting/linear-response.md
    - Configure synthetic sweeps: getting-started/understanding-poscidyn/artificial-sweeps/nearest-neighbour.md
    - Interpret sweep results: guides/interpreting-results.md

  - Examples:
    - 1-DOF Duffing sweep: examples/frequency-sweep/1dof-duffing.md
    - 1-DOF Duffing time response: examples/time-response/1dof-duffing.md
    - Coupled Duffing systems: examples/coupled-duffing.md

  - Reference:
    - Public API and result objects: api/classes.md

  - Development:
    - Extending Poscidyn: usage/extending-poscidyn.md
    - Status and roadmap: future-work.md
