[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poscidyn"
version = "0.1.5"
description = "Batched nonlinear oscillator dynamics in Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
  { name = "Raymond Knetemann", email = "r.knetemann@tudelft.nl" }
]

keywords = [
  "nonlinear-dynamics",
  "oscillators",
  "duffing",
  "frequency-response",
  "frequency-sweep",
  "time-integration",
  "simulation",
  "jax",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
  "jax>=0.4.0",
  "diffrax>=0.7.0",
  "equinox>=0.13.0",
  "h5py>=3.14.0",
  "tqdm>=4.67.0",
  "matplotlib>=3.10.0",
]

[project.urls]
Homepage = "https://github.com/rknetemann/poscidyn"
Repository = "https://github.com/rknetemann/poscidyn"
Issues = "https://github.com/rknetemann/poscidyn/issues"
Documentation = "https://rknetemann.github.io/poscidyn/"

[project.optional-dependencies]
docs = [
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.7.0",
  "mkdocstrings-python>=1.10.0",
]
test = [
  "pytest>=8.0",
]
profiling = [
  "click>=8.2.0",
  "tensorboard>=2.20.0",
  "tensorboard_plugin_profile>=2.20.0",
  "xprof>=2.20.0",
]
dev = [
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.7.0",
  "mkdocstrings-python>=1.10.0",
  "pytest>=8.0",
]

gpu = [
  "jax[cuda13]>=0.4.0",
]
cuda12 = [
  "jax[cuda12]>=0.4.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["poscidyn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
